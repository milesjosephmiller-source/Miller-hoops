<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miller Hoops</title><style>
:root{--navy:#102a43;--orange:#f97316;--blue:#8ed8ff;--bg:#f3faff;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy)}header{background:var(--navy);color:#fff;padding:16px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:25px}.brand small{color:var(--blue)}.ball{width:48px;height:48px;border-radius:50%;background:var(--orange);border:4px solid var(--blue);position:relative;overflow:hidden;box-shadow:0 3px 10px #0004}.ball:before{content:'';position:absolute;width:8px;height:70px;background:#fff;left:17px;top:-12px;transform:rotate(28deg);border-radius:50%}.ball:after{content:'';position:absolute;width:70px;height:8px;background:#fff;left:-12px;top:19px;transform:rotate(-28deg);border-radius:50%}.hero{padding:55px 6%;background:linear-gradient(135deg,#fff,#dff5ff);text-align:center}.hero h2{font-size:clamp(38px,7vw,72px);margin:0 0 10px;font-weight:900}.hero h2 span{color:var(--orange)}.hero p{font-size:18px;margin:0;color:#486581}.wrap{max-width:1100px;margin:0 auto;padding:28px 6%}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}.toolbar button,.add{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:#d9f2ff;color:var(--navy)}.toolbar button.active,.add{background:var(--orange);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 18px #102a4314;border:1px solid #d7eaf5}.tag{display:inline-block;background:var(--blue);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.card h3{margin:12px 0 8px}.card p{color:#486581;min-height:42px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #c9dfeb;background:#fff;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:700}.actions .start{background:var(--navy);color:#fff}.empty{text-align:center;padding:40px;color:#486581}.modal{position:fixed;inset:0;background:#102a4388;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;width:min(520px,100%);border-radius:18px;padding:24px}.box h3{margin-top:0}.box input,.box select,.box textarea{width:100%;padding:11px;border:1px solid #c9dfeb;border-radius:9px;margin:6px 0 14px;font:inherit}.box textarea{min-height:100px}.row{display:flex;gap:10px;justify-content:flex-end}.row button{padding:10px 15px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.cancel{background:#eaf2f6}.save{background:var(--orange);color:#fff}.timer{margin-top:12px;font-weight:800;color:var(--orange)}footer{text-align:center;padding:35px;color:#486581}
</style></head><body>
<header><div class="brand"><div class="ball"></div><div><h1>Miller Hoops</h1><small>Train. Improve. Compete.</small></div></div><button class="add" onclick="openAdd()">+ Add Drill</button></header>
<section class="hero"><h2>GET BETTER. <span>EVERY DAY.</span></h2><p>Your basketball training. Your drills. Your progress.</p></section>
<main class="wrap"><div class="toolbar" id="filters"></div><div class="grid" id="grid"></div></main><footer>Miller Hoops 🏀 • Custom basketball training</footer>
<div class="modal" id="modal"><div class="box"><h3 id="modalTitle">Add Drill</h3><label>Name</label><input id="name"><label>Category</label><select id="cat"><option>Shooting</option><option>Ball Handling</option><option>Finishing</option><option>Defense</option></select><label>Description</label><textarea id="desc"></textarea><label>Minutes</label><input id="mins" type="number" min="1" value="10"><div class="row"><button class="cancel" onclick="closeModal()">Cancel</button><button class="save" onclick="saveDrill()">Save Drill</button></div></div></div>
<script>
const key='millerHoopsDrills';let drills=JSON.parse(localStorage.getItem(key)||'null')||[
{id:1,name:'Form Shooting',cat:'Shooting',desc:'Make 25 close-range shots with perfect form.',mins:10},{id:2,name:'Cone Handles',cat:'Ball Handling',desc:'Attack 5 cones using crossovers, between-the-legs and behind-the-back.',mins:12},{id:3,name:'Mikan Drill',cat:'Finishing',desc:'Finish alternating hands around the rim.',mins:8},{id:4,name:'Defensive Slides',cat:'Defense',desc:'Slide side-to-side while staying low and balanced.',mins:8}];let filter='All',editing=null,timer;
function persist(){localStorage.setItem(key,JSON.stringify(drills))}function cats(){return ['All',...new Set(drills.map(d=>d.cat))]}function render(){filters.innerHTML=cats().map(c=>`<button class="${c===filter?'active':''}" onclick="filter='${c}';render()">${c}</button>`).join('');let list=filter==='All'?drills:drills.filter(d=>d.cat===filter);grid.innerHTML=list.length?list.map(d=>`<article class="card"><span class="tag">${d.cat}</span><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p><strong>${d.mins} min</strong><div class="actions"><button class="start" onclick="startTimer(${d.id})">▶ Start</button><button onclick="editDrill(${d.id})">Edit</button><button onclick="delDrill(${d.id})">Delete</button></div><div id="t${d.id}" class="timer"></div></article>`).join(''):'<div class="empty">No drills yet. Add one above.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openAdd(){editing=null;modalTitle.textContent='Add Drill';name.value='';cat.value='Shooting';desc.value='';mins.value=10;modal.classList.add('show')}function editDrill(id){let d=drills.find(x=>x.id===id);editing=id;modalTitle.textContent='Edit Drill';name.value=d.name;cat.value=d.cat;desc.value=d.desc;mins.value=d.mins;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function saveDrill(){let d={id:editing||Date.now(),name:name.value.trim()||'New Drill',cat:cat.value,desc:desc.value.trim()||'Custom basketball drill.',mins:Math.max(1,+mins.value||10)};if(editing)drills=drills.map(x=>x.id===editing?d:x);else drills.push(d);persist();closeModal();render()}function delDrill(id){if(confirm('Delete this drill?')){drills=drills.filter(d=>d.id!==id);persist();render()}}function startTimer(id){let d=drills.find(x=>x.id===id),end=Date.now()+d.mins*60000;clearInterval(timer);timer=setInterval(()=>{let left=Math.max(0,end-Date.now()),el=document.getElementById('t'+id);if(!el)return;if(!left){el.textContent='Done! 🔥';clearInterval(timer);return}let m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=`Time left: ${m}:${String(s).padStart(2,'0')}`},250);}
render();
</script></body></html>
